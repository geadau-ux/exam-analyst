<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>試題分析小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: 批改桌 — 左側固定的「題目卡」，右側是分頁的分析紙；紅筆用於重點與錯誤、黃色螢光筆標示字數 */
:root {
  --bg: #f6f3ec;
  --paper: #fffdf8;
  --ink: #2b2620;
  --ink-soft: #6b6156;
  --line: #e2dbcd;
  --red: #c2362b;
  --red-soft: #f7e3df;
  --mark: #f5dc6b;
  --mark-soft: #fbf1c4;
  --green: #3c7a4f;
  --green-soft: #e1efe4;
  --shadow: 0 1px 0 rgba(60,40,20,.05), 0 6px 20px -12px rgba(60,40,20,.35);
  --f-display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1916; --paper: #24211d; --ink: #ece6dc; --ink-soft: #a89e90; --line: #3a352e;
  --red: #ec6a5c; --red-soft: #3d2420; --mark: #d9bd45; --mark-soft: #3a3320;
  --green: #7cc394; --green-soft: #1f3326; --shadow: 0 6px 20px -12px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1916; --paper: #24211d; --ink: #ece6dc; --ink-soft: #a89e90; --line: #3a352e;
  --red: #ec6a5c; --red-soft: #3d2420; --mark: #d9bd45; --mark-soft: #3a3320;
  --green: #7cc394; --green-soft: #1f3326; --shadow: 0 6px 20px -12px rgba(0,0,0,.7); color-scheme: dark; }

* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; min-width: 0; font: inherit; font-family: var(--f-mono); font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.keyrow input:focus-visible, #customModel:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
#customModel { width: 100%; font: inherit; font-family: var(--f-mono); font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.chk input { accent-color: var(--red); }
.chip { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.no { background: var(--red-soft); color: var(--red); }
.dlg-b a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 3px; }
.test-out { font-size: 13px; }
.test-out.ok { color: var(--green); } .test-out.bad { color: var(--red); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); margin-bottom: 22px; }
header.top h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 34px); margin: 0; letter-spacing: .04em; }
header.top h1 .pen { color: var(--red); }
header.top p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }

.grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
aside.input { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 860px) { aside.input { position: static; } }

.label { font-size: 12px; font-weight: 700; color: var(--ink-soft); letter-spacing: .12em; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--ink-soft); font: inherit; font-weight: 500; padding: 8px 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible, .btn:focus-visible, .tab:focus-visible, textarea:focus-visible, select:focus-visible, .drop:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.drop { border: 1.5px dashed var(--ink-soft); border-radius: 6px; padding: 18px 14px; text-align: center; color: var(--ink-soft); cursor: pointer; background: var(--bg); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--red); background: var(--red-soft); }
.drop strong { color: var(--ink); display: block; font-size: 15px; margin-bottom: 2px; }
.drop small { font-size: 12.5px; }
.drop-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.preview { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
.preview img { display: block; width: 100%; max-height: 320px; object-fit: contain; }
.preview .x { position: absolute; top: 6px; right: 6px; }

textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; resize: vertical; }
textarea#qtext { min-height: 150px; }
textarea#note { min-height: 64px; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 700; border-radius: 6px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
.btn:hover { background: var(--mark-soft); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-size: 16px; padding: 12px 16px; }
.btn.primary:hover { filter: brightness(1.06); background: var(--red); }
.btn.small { font-size: 13px; padding: 5px 10px; font-weight: 500; }
.btn.ghost { border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 12.5px; color: var(--ink-soft); margin: 0; }
.status { font-size: 13.5px; padding: 8px 10px; border-radius: 6px; background: var(--mark-soft); }
.status.err { background: var(--red-soft); color: var(--red); }

.res { margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.res a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 3px; }
.res .mail { font-family: var(--f-mono); font-size: 12.5px; user-select: all; }

main.out { min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { flex: none; border: 1px solid transparent; border-bottom: 0; background: transparent; font: inherit; font-weight: 500; color: var(--ink-soft); padding: 9px 14px; border-radius: 6px 6px 0 0; cursor: pointer; position: relative; top: 1px; }
.tab[aria-selected="true"] { background: var(--paper); color: var(--ink); border-color: var(--line); font-weight: 700; }
.tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-left: 6px; vertical-align: middle; }
.panel { background: var(--paper); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 6px 6px; padding: 22px clamp(16px, 3vw, 32px) 28px; box-shadow: var(--shadow); min-height: 420px; }

.sample-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--red); border: 1px solid var(--red); border-radius: 3px; padding: 0 6px; margin-right: 8px; letter-spacing: .1em; }
.qbox { background: var(--bg); border-left: 3px solid var(--ink); padding: 10px 14px; margin-bottom: 18px; border-radius: 0 6px 6px 0; }
.qbox .q { font-family: var(--f-display); font-size: 17px; }
.qbox .ans { margin-top: 4px; font-size: 14px; }
.qbox .ans b { color: var(--green); }

h2.sec { font-family: var(--f-display); font-size: 21px; font-weight: 700; margin: 24px 0 10px; display: flex; align-items: baseline; gap: 10px; text-wrap: balance; }
h2.sec:first-of-type { margin-top: 0; }
h2.sec .n { color: var(--red); }
.ability { margin: 0; }
.dist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.dist li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: baseline; }
.opt { font-family: var(--f-mono); font-size: 13px; font-weight: 500; color: var(--red); border: 1.5px solid var(--red); border-radius: 999px; padding: 0 9px; white-space: nowrap; }
.causes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: c; }
@media (max-width: 560px) { .causes { grid-template-columns: minmax(0,1fr); } }
.causes li { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; counter-increment: c; }
.causes li .t { font-weight: 700; }
.causes li .t::before { content: counter(c) "．"; color: var(--red); }
.sugg { display: grid; gap: 14px; }
.sugg .item h3 { font-size: 15.5px; margin: 0 0 4px; }
.sugg .item h3 span { color: var(--red); font-family: var(--f-display); margin-right: 6px; }
.sugg ul { margin: 0; padding-left: 1.2em; }
.sugg li { margin: 2px 0; }
.cnt { font-family: var(--f-mono); font-size: 11px; padding: 0 5px; border-radius: 3px; background: var(--mark-soft); color: var(--ink-soft); margin-left: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cnt.bad { background: var(--red-soft); color: var(--red); }
.causes .cnt { margin-left: 0; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--line); }
.empty { text-align: center; padding: 40px 10px; color: var(--ink-soft); }
.empty h3 { font-family: var(--f-display); color: var(--ink); font-size: 20px; margin: 0 0 6px; }
.empty p { max-width: 44ch; margin: 0 auto 16px; }
.thinking { color: var(--ink-soft); display: flex; align-items: center; gap: 10px; padding: 16px 0; }
.thinking i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
@media (prefers-reduced-motion: reduce) { .thinking i { animation: none; } }

.md { max-width: 72ch; }
.md h1, .md h2, .md h3 { font-family: var(--f-display); line-height: 1.35; text-wrap: balance; }
.md h1 { font-size: 23px; margin: 0 0 12px; }
.md h2 { font-size: 20px; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.md h3 { font-size: 17px; margin: 18px 0 6px; }
.md p, .md ul, .md ol { margin: 8px 0; }
.md strong { background: linear-gradient(transparent 60%, var(--mark-soft) 60%); }
.md table { border-collapse: collapse; font-size: 14px; }
.md .tw { overflow-x: auto; margin: 10px 0; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; text-align: left; }
.md th { background: var(--bg); }
.md code { font-family: var(--f-mono); font-size: 13px; background: var(--bg); padding: 0 4px; border-radius: 3px; }
.md blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--mark); color: var(--ink-soft); }
.md hr { border: 0; border-top: 1px dashed var(--line); margin: 20px 0; }
.hdr-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.theme-seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--paper); }
.theme-seg button { border: 0; background: transparent; color: var(--ink-soft); font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer; }
.theme-seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.theme-seg button:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
.model-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); }
.model-line b { font-size: 14px; }
.model-line small { display: block; color: var(--ink-soft); font-size: 12px; line-height: 1.4; }
dialog#settings { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 20px 60px -20px rgba(0,0,0,.5); }
dialog#settings::backdrop { background: rgba(30,20,10,.45); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-family: var(--f-display); font-size: 20px; margin: 0; }
.dlg-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.mopt { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; align-items: start; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; }
.mopt:has(input:checked) { border-color: var(--red); background: var(--red-soft); }
.mopt input { margin-top: 5px; accent-color: var(--red); }
.mopt .nm { font-weight: 700; }
.mopt .tg { font-size: 11.5px; font-weight: 700; color: var(--red); margin-left: 6px; }
.mopt .ds { grid-column: 2; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.keynote { font-size: 13px; background: var(--mark-soft); border-radius: 6px; padding: 10px 12px; line-height: 1.6; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 6px; font-size: 14px; z-index: 20; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>試題分析小幫手<span class="pen">．</span></h1>
    <div class="hdr-tools">
      <div class="theme-seg" role="group" aria-label="背景亮暗">
        <button type="button" data-theme-set="light" aria-pressed="false">☀ 亮色</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">☾ 暗色</button>
      </div>
      <button type="button" class="btn small" id="openSettings">🔑 API 金鑰／型號</button>
    </div>
    <p style="flex-basis:100%">上傳數學題目，找出誘答陷阱、分析錯題原因、產出教學建議與教案（優履工作室研發）</p>
  </header>

  <div class="grid">
    <aside class="input card" aria-label="輸入試題">
      <div>
        <div class="label">試題來源</div>
        <div class="seg" role="group" aria-label="試題來源" style="margin-top:6px">
          <button type="button" id="modeImg" aria-pressed="true">圖片</button>
          <button type="button" id="modeText" aria-pressed="false">文字</button>
        </div>
      </div>

      <div id="imgArea">
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="選擇試題圖片">
          <strong>拖曳、貼上或選擇題目圖片</strong>
          <small>支援截圖直接 Ctrl+V 貼上</small>
          <div class="drop-actions">
            <button type="button" class="btn small" id="pickBtn">選擇檔案</button>
            <button type="button" class="btn small ghost" id="camBtn">用手機拍照</button>
          </div>
        </div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        <input type="file" id="cam" accept="image/*" capture="environment" hidden>
        <div class="preview" id="preview" hidden>
          <img id="previewImg" alt="試題圖片預覽">
          <button type="button" class="btn small x" id="clearImg">移除</button>
        </div>
        <p class="hint" id="imgUnavail" hidden>這個檢視無法傳送圖片，請改用「文字」貼上題目。</p>
      </div>

      <div id="textArea" hidden>
        <label class="label" for="qtext">題目文字</label>
        <textarea id="qtext" style="margin-top:6px" placeholder="例如：3/4 − 1/3 = ？ (A) 2/1 (B) 2/12 (C) 5/12 (D) 2/7"></textarea>
      </div>

      <div>
        <label class="label" for="note">補充說明（選填）</label>
        <textarea id="note" style="margin-top:6px" placeholder="年級、正確答案、學生答題情形，例如：五年級，答對率 48%，多數選 A"></textarea>
      </div>

      <div>
        <div class="label">使用型號</div>
        <div class="model-line" style="margin-top:6px">
          <div style="min-width:0"><b id="modelName"></b><small id="modelDesc"></small></div>
          <button type="button" class="btn small" id="openSettings2">更換</button>
        </div>
      </div>

      <button type="button" class="btn primary" id="analyzeBtn">開始分析</button>
      <div class="status" id="status" hidden></div>

      <div class="res">
        <div class="label">資源連結</div>
        <a href="https://padlet.com/cdrcdr/breakout-room/ldoNv8bGKDGD2JXV-W7ZVbegpqEZ5XNDM" target="_blank" rel="noopener noreferrer">數學學力檢測（題目整理）↗</a>
        <a href="https://padlet.com/cdrcdr/breakout-room/Bbjnqxr8bYBZ493Q-W7ZVbegpqEZ5XNDM" target="_blank" rel="noopener noreferrer">數學篩選測驗（題目整理）↗</a>
        <div style="margin-top:4px">問題反應信箱：<span class="mail">qekepv@gmail.com</span></div>
      </div>
    </aside>

    <main class="out">
      <div class="tabs" role="tablist" id="tabs"></div>
      <section class="panel" id="panel" role="tabpanel"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<dialog id="settings" aria-labelledby="setTitle">
  <div class="dlg-h"><h2 id="setTitle">API 金鑰與型號</h2><button type="button" class="btn small ghost" id="closeSettings">關閉</button></div>
  <div class="dlg-b">
    <div class="status" id="setPrompt" hidden></div>
    <div class="label">1．選擇 AI 服務</div>
    <div class="seg" role="group" aria-label="AI 服務">
      <button type="button" data-prov="gemini" aria-pressed="true">Google Gemini</button>
      <button type="button" data-prov="claude" aria-pressed="false">Anthropic Claude</button>
    </div>
    <div class="label" style="margin-top:6px">2．輸入 API 金鑰</div>
    <div class="keyrow">
      <input type="password" id="keyInput" autocomplete="off" spellcheck="false" placeholder="貼上你的 API 金鑰">
      <button type="button" class="btn small ghost" id="keyShow">顯示</button>
    </div>
    <p class="hint" id="keyHelp"></p>
    <label class="chk"><input type="checkbox" id="keyRemember" checked> 在這台電腦記住金鑰（公用電腦請取消勾選）</label>
    <div class="label" style="margin-top:6px">3．選擇型號</div>
    <div id="modelList" style="display:flex;flex-direction:column;gap:8px"></div>
    <input type="text" id="customModel" spellcheck="false" placeholder="或自行輸入型號 ID（選填，會優先使用）">
    <div class="row">
      <button type="button" class="btn small" id="testKey">測試連線</button>
      <span class="test-out" id="testOut"></span>
    </div>
    <div class="keynote"><b>金鑰安全</b><br>金鑰只存在這個瀏覽器裡，分析時由瀏覽器直接送到 Google 或 Anthropic，不會經過其他伺服器。費用依各家 API 計價，由金鑰擁有者支付。</div>
  </div>
  <div class="dlg-f"><button type="button" class="btn primary" id="saveSettings" style="font-size:14px;padding:8px 16px">儲存設定</button></div>
</dialog>

<script>
// ---------- 理論文本（沿用原工具） ----------
const CONJECTURING_TEXT = `數學臆測是一個歷程，從建立資料、觀察資料、尋求規律、提出猜想，藉由小組或全班共同檢驗猜想的正確性及效化猜想的可靠性，再將猜想推論到所有情況，並加以證實。

// ---------- 呼叫 API（瀏覽器直接連線） ----------
async function readSSE(res, onEvent) {
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split(/\r?\n/); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      const d = line.slice(5).trim(); if (!d || d === "[DONE]") continue;
      try { onEvent(JSON.parse(d)); } catch (e) { if (e.isApi) throw e; }
    }
  }
}
function httpError(status, msg, prov) {
  const map = {
    400: "請求內容有誤（可能是型號 ID 錯誤或圖片格式不支援）",
    401: "API 金鑰無效，請確認是否貼錯",
    403: "金鑰沒有使用這個型號的權限",
    404: "找不到這個型號，請換一個型號",
    429: "已達使用頻率或額度上限，請稍後再試或檢查帳單",
    500: "服務暫時發生錯誤，請稍後再試", 503: "服務目前忙碌，請稍後再試", 529: "服務目前忙碌，請稍後再試",
  };
  const e = new Error((map[status] || `伺服器回應錯誤 (${status})`) + (msg ? `：${msg}` : ""));
  e.status = status; e.isApi = true; return e;
}
async function callLLM({ provider = cfg.provider, key = activeKey(), model = activeModel(), prompt, image, json, onText, signal, maxTokens = 8000, temperature, noFallback }) {
  if (!key) { const e = new Error("尚未設定 API 金鑰"); e.noKey = true; throw e; }
  let text = "", truncated = false;
  const emit = (d) => { if (!d) return; text += d; onText?.(text); };
  if (provider === "gemini") {
    const parts = [];
    if (image) parts.push({ inlineData: { mimeType: image.mime, data: image.b64 } });
    parts.push({ text: prompt });
    const body = { contents: [{ role: "user", parts }], generationConfig: { temperature: temperature ?? 0.4 } };
    if (json) body.generationConfig.responseMimeType = "application/json";
    const go = async (m) => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`, {
      method: "POST", signal, headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: JSON.stringify(body) });
    let res = await go(model);
    if (!res.ok && (res.status === 404 || res.status === 503) && !noFallback && model !== PROVIDERS.gemini.defaultModel) {
      toast(`型號 ${model} 暫時無法使用，自動改用 ${PROVIDERS.gemini.defaultModel}`);
      res = await go(PROVIDERS.gemini.defaultModel);
    }
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw httpError(res.status, j?.error?.message, provider); }
    await readSSE(res, (ev) => {
      if (ev.error) { const e = httpError(ev.error.code || 500, ev.error.message); throw e; }
      const c = ev.candidates?.[0];
      (c?.content?.parts || []).forEach((p) => { if (p.text && !p.thought) emit(p.text); });
      if (c?.finishReason === "MAX_TOKENS") truncated = true;
    });
  } else {
    const content = [];
    if (image) content.push({ type: "image", source: { type: "base64", media_type: image.mime, data: image.b64 } });
    content.push({ type: "text", text: prompt });
    const body = { model, max_tokens: maxTokens, stream: true, messages: [{ role: "user", content }] };
    if (temperature != null) body.temperature = temperature;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify(body) });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw httpError(res.status, j?.error?.message, provider); }
    await readSSE(res, (ev) => {
      if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") emit(ev.delta.text);
      else if (ev.type === "message_delta" && ev.delta?.stop_reason === "max_tokens") truncated = true;
      else if (ev.type === "error") throw httpError(529, ev.error?.message);
    });
  }
  if (!text.trim()) throw new Error("模型沒有回傳內容，請再試一次或換一個型號");
  return { text, truncated };
}
function parseJSONLoose(t) {
  try { return JSON.parse(t); } catch (e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  return null;
}
function prepImage(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("讀取圖片失敗"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("這張圖片無法讀取，請換一張 JPG 或 PNG 圖片"));
      img.onload = () => {
        const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.9);
        resolve({ preview: r.result, image: { mime: "image/jpeg", b64: url.split(",")[1] } });
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

  setStatus(""); state.busy = k; state.tab = k; delete state.md[k];
  state.ctl = new AbortController(); render();
  const a = state.analysis && !state.isExample ? state.analysis : null;
  const known = a ? `\n\n【已完成的試題分析，可參考】\n題目：${a.question || ""}\n正確答案：${a.answer || ""}\n能力面向：${a.abilityAssessment}\n錯題主因：${(a.errorCauses || []).map((c) => c.title + "—" + c.summary).join("；")}` : "";

  try {
    const { text, truncated } = await callLLM({ prompt, image: inp.images, signal: state.ctl.signal, maxTokens: 12000,
      onText: (t) => { state.md[k] = t; const o = $("mdOut"); if (o && state.tab === k) o.innerHTML = mdHtml(t); else if (state.tab === k) render(); } });
    state.md[k] = text + (truncated ? "\n\n> 內容過長被截斷，可按「重新產生」再試一次。" : "");
  } catch (e) {
    if (e?.name !== "AbortError") { setStatus(errText(e), true); if (!state.md[k]) delete state.md[k]; }
  }
  state.busy = null; state.ctl = null; render();
}
$("analyzeBtn").onclick = analyze;

// ---------- 啟動 ----------
render();
</script>
